# Site estático das aulas. No Netlify, use "aulas/site" como Base directory.
[build]
  publish = "."
  command = "echo 'Site estático, sem build'"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Cache-Control = "public, max-age=0, must-revalidate"
